name: 2 - Crear base, tablas y cargar dataset
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bnp-database
  cancel-in-progress: false
env:
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  PROJECT_SUFFIX: ${{ vars.PROJECT_SUFFIX }}
  SQL_DATABASE: bibliotecas
  SQL_ADMIN: bnpadmin
  SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Preparar y validar datos originales
        run: python scripts/prepare_data.py
      - name: Iniciar sesión en Azure
        run: bash scripts/azure_login.sh
      - name: Crear base de datos y acceso temporal
        run: |
          [[ "$PROJECT_SUFFIX" =~ ^[a-z0-9]{6,12}$ ]] || { echo 'Configura PROJECT_SUFFIX'; exit 1; }
          RG="rg-bnp-$PROJECT_SUFFIX"
          SERVER="sql-bnp-$PROJECT_SUFFIX"
          az sql server show --resource-group "$RG" --name "$SERVER" --output none
          if ! az sql db show --resource-group "$RG" --server "$SERVER" --name "$SQL_DATABASE" --output none 2>/dev/null; then
            az sql db create --resource-group "$RG" --server "$SERVER" --name "$SQL_DATABASE" --service-objective Basic --output none
          fi
          RULE="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IP=$(curl --fail --silent --show-error --retry 3 https://api.ipify.org)
          printf 'SQL_SERVER=%s.database.windows.net\nFIREWALL_RULE=%s\n' "$SERVER" "$RULE" >> "$GITHUB_ENV"
          az sql server firewall-rule create --resource-group "$RG" --server "$SERVER" --name "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" --output none
      - name: Instalar controlador SQL Server
        run: |
          curl --fail --silent --show-error -o /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update -qq
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Ejecutar SQL y verificar conteos
        run: python scripts/run_sql.py
      - name: Guardar datos procesados como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: dataset-procesado
          path: |
            data/bibliotecas.csv
            data/provenance.json
            sql/02_load_data.sql
      - name: Cerrar acceso temporal
        if: ${{ always() && env.FIREWALL_RULE != '' }}
        run: |
          az sql server firewall-rule delete --resource-group "rg-bnp-$PROJECT_SUFFIX" --server "sql-bnp-$PROJECT_SUFFIX" --name "$FIREWALL_RULE" --output none
